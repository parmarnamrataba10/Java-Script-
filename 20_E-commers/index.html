


<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zivara</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

   
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">

                <a class="navbar-brand ms-lg-5" href="#">Zivara</a>

                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse"
                    id="navbarSupportedContent">

                    <ul class="navbar-nav m-auto mb-2 mb-lg-0">

                        <li class="nav-item">
                            <a class="nav-link active" href="#">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" href="#"
                                onclick="showCartItem(); return false;">
                                Cart
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" href="#"
                                onclick="addProductModalShow(); return false;">
                                Add product
                            </a>
                        </li>

                    </ul>

                    <form class="d-flex" role="search" id="searchForm">
                        <input class="form-control me-2" type="search"
                            id="searchInput" placeholder="Search"
                            aria-label="Search">

                        <button class="btn btn-outline-success" type="submit">
                            Search
                        </button>
                    </form>

                </div>
            </div>
        </nav>
    </header>

    <main class="my-3">

        <div class="container">
            <div class="row g-4" id="product-list">
            </div>
        </div>

        <!-- Cart Modal -->
        <div class="modal" id="cartModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered modal-xl">
                <div class="modal-content">

                    <div class="modal-header">
                        <h4 class="modal-title">Cart Items</h4>
                        <button type="button" class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>

                    <div class="modal-body">
                        <div class="table-responsive">
                            <table id="cartTable"
                                class="table table-striped table-hover table-bordered">

                                <thead>
                                    <tr>
                                        <th>Id</th>
                                        <th>Image</th>
                                        <th>Name</th>
                                        <th>Price</th>
                                        <th>Quantity</th>
                                        <th>Total</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>

                                <tbody id="table-body"></tbody>

                            </table>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <h5 class="me-auto" id="GrandTotal">Grand Total: ₹0</h5>

                        <button type="button" class="btn btn-secondary"
                            data-bs-dismiss="modal">
                            Close
                        </button>

                        <button type="button" class="btn btn-primary"
                            onclick="checkOut()">
                            Check Out
                        </button>
                    </div>

                </div>
            </div>
        </div>

        <!-- Add Product Modal -->
        <div class="modal" id="addProductModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Add Product</h5>
                        <button type="button" class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>

                    <div class="modal-body">
                        <form id="addProductForm">

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control"
                                    id="productName" name="ProductName"
                                    placeholder="Product Name" required>
                                <label for="productName">Product Name</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="number" class="form-control"
                                    id="ProductPrice" name="ProductPrice"
                                    placeholder="Product Price" min="0" required>
                                <label for="ProductPrice">Product Price</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="url" class="form-control"
                                    id="ProductImage" name="ProductImage"
                                    placeholder="Product Image" required>
                                <label for="ProductImage">Product Image URL</label>
                            </div>

                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary"
                                    data-bs-dismiss="modal">
                                    Close
                                </button>

                                <button type="submit" class="btn btn-primary">
                                    Add Product
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Update Product Modal -->
        <div class="modal" id="updateProductModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Update Product</h5>
                        <button type="button" class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>

                    <div class="modal-body">
                        <form id="updateProductForm">

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control"
                                    id="updateProductName"
                                    placeholder="Product Name" required>
                                <label for="updateProductName">Product Name</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="number" class="form-control"
                                    id="updateProductPrice"
                                    placeholder="Product Price" min="0" required>
                                <label for="updateProductPrice">Product Price</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="url" class="form-control"
                                    id="updateProductImage"
                                    placeholder="Product Image URL" required>
                                <label for="updateProductImage">Product Image URL</label>
                            </div>

                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary"
                                    data-bs-dismiss="modal">
                                    Close
                                </button>

                                <button type="submit" class="btn btn-primary">
                                    Update Product Details
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script src="./script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
