

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Events Practice</title>
</head>
<body>

    <button id="loginBtn">Click Me</button>

    <button id="doubleBtn">Click Twice</button>

    <h1 id="title">JavaScript Event Handling</h1>

    <br><br>

    <form id="userForm">

        <label for="username">Username</label>
        <input type="text" id="username"name="username" placeholder="Enter username" >

        <button type="submit">Register</button>

    </form>

    <h2 id="overText">Move mouse over me</h2>

    <h3 id="enterText">Enter the area</h3>

    <h4 id="leaveText">Move mouse away</h4>

    <h5 id="moveText">Move your mouse here</h5>

    <p id="upText">Release mouse button here</p>

    <p id="downText">Press mouse button here</p>

    <br><br>

    <input type="text" id="keyDownInput" placeholder="Try key down" >

    <br><br>

    <input type="text" id="keyUpInput" placeholder="Try key up" >

    <br><br>

    <input type="text" id="keyPressInput" placeholder="Try typing"  >

    <script src="./script.js"></script>

</body>
</html>
